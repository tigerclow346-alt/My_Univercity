<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصتي</title>
<style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            direction: rtl;
            text-align: right;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            color: white;
            text-decoration: none;
        }
        main {
            padding: 40px 20px;
            max-width: 450px;
            margin: auto;
        }
        .form-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .form-card h2 {
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #3498db;
        }
        .submit-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #2980b9;
        }
        .form-footer {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .form-footer a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }
</style>
  </head>
  <body>

    <header>
	  <h2>صفحة تسجيل دخول</h2>
	  <div>
		<a href="index.html">الرئيسية</a>
	  </div>
    </header>

    <main>
	  <div class="form-card">
		<h2>تسجيل الدخول</h2>
		<form id="loginForm">
		  <div class="input-group">
			<label for="txt">اسم المستخدم</label>
			<input type="txt" id="nekname" required placeholder="ادخل لقبك هنا">
		  </div>

		  <div class="input-group">
			<label for="password">كلمة المرور</label>
			<input type="password" id="password" required placeholder="ادخل كلمة المرور">
		  </div>

		  <button type="submit" class="submit-btn">دخول</button>
		</form>

		<div class="form-footer">
		  ليس لديك حساب؟ <a href="register.html">انشئ حساب جديد</a>
		</div>
	  </div>
    </main>

<script>
        document.getElementById('loginForm').addEventListener('click', function(e) {
            // يمكننا معالجة الحدث هنا عند الربط بقاعدة بيانات لاحقاً
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // منع إعادة تحميل الصفحة مؤقتاً
            
            // محاكاة تسجيل الدخول بنجاح والانتقال للرئيسية
            alert('تم تسجيل الدخول بنجاح!');
            window.location.href = "index.html";
        });
</script>

  </body>
</html>
