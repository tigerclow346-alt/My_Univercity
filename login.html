<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصتي</title>
<link rel="stylesheet" href="login.css">

  </head>
  <body>

    <header>
	  <h2>صفحة تسجيل دخول</h2>
	  <div>
		<a href="index.html">الرئيسية</a>
	  </div>
    </header>

    <main>
	  <div class="form-card">
		<h2>تسجيل الدخول</h2>
		<form id="loginForm">
		  <div class="input-group">
			<label for="txt">اسم المستخدم</label>
			<input type="txt" id="nekname" required placeholder="ادخل لقبك هنا">
		  </div>

		  <div class="input-group">
			<label for="password">كلمة المرور</label>
			<input type="password" id="password" required placeholder="ادخل كلمة المرور">
		  </div>

		  <button type="submit" class="submit-btn">دخول</button>
		</form>

		<div class="form-footer">
		  ليس لديك حساب؟ <a href="register.html">انشئ حساب جديد</a>
		</div>
	  </div>
    </main>


  </body>
</html>
