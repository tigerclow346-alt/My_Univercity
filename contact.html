<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة التواصل - منصتي</title>
<link rel="stylesheet" href="styles.css">



    
  </head>
  <body>

    <header>
      <h2>صفحة التواصل</h2>
      <div>
        <a href="index.html">الرئيسية</a>
      </div>
    </header>

    <main>
      <form id="contactForm" class="contact-form">
        <h2>تواصل معنا</h2>
        <div class="form-group">
          <label for="name">الاسم</label>
          <input type="text" id="name" name="name" required placeholder="ادخل اسمك" />
        </div>
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" required placeholder="ادخل بريدك الإلكتروني" />
        </div>
        <div class="form-group">
          <label for="message">الرسالة</label>
          <textarea id="message" name="message" rows="5" required placeholder="اكتب رسالتك هنا..."></textarea>
        </div>
        <button type="submit" class="btn">إرسال الرسالة</button>
        <div id="formMessage" class="message"></div>
      </form>
    </main>

  </body>
</html>
