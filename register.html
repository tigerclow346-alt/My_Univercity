<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - منصتي</title>
<style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            direction: rtl;
            text-align: right;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            color: white;
            text-decoration: none; 
        }
        main {
            padding: 40px 20px;
            max-width: 450px;
            margin: auto;
        }
        .form-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .form-card h2 {
            margin-bottom: 25px;
            color: #2c3e50;
        }
		.input-group1{
    display: flex;             /* لجعل العناصر بجانب بعضها */
    align-items: center;       /* محاذاة العناصر عمودياً في المنتصف */
    gap: 15px;                 /* المسافة الفاصلة بين التسمية والقائمة */
    margin-bottom: 15px;
}

.input-group1 label {
    flex: 0 0 80px;            /* تخصيص عرض ثابت للكلمة (مثل الكلية) */
    font-weight: bold;
}

.input-group1 select {
    flex: 1;                   /* جعل قائمة الاختيار تأخذ باقي المساحة المتاحة في السطر */
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-family: Tahoma, sans-serif;
}

		
		
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #2ecc71;
        }
        .submit-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #27ae60;
        }
        .form-footer {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .form-footer a {
            color: #2ecc71;
            text-decoration: none;
            font-weight: bold;
        }
        .form-footer a:hover {
            text-decoration: ;
        }
</style>
  </head>
  <body>
 
    <header>
	  <h2>صفحة تسجيل عضو جديد</h2>
	  <div>
		<a href="index.html">الرئيسية</a>
	  </div>
    </header>

    <main>
	  <div class="form-card">
		<h2>إنشاء حساب جديد</h2>
		<form id="registerForm">
		  <div class="input-group">
			<label for="username">اسم المستخدم</label>
			<input type="text" id="username" required placeholder="ادخل اسمك الكامل">
		  </div>

		  <div class="input-group">
			<label for="username2">لقبك</label>
			<input type="text" id="username2" required placeholder="ادخل اسم تريده ان يظهر للاخرين">
		  </div>
		   
		  <div class="input-group">
			<label for="email">البريد الإلكتروني</label>
			<input type="email" id="email" required placeholder="ادخل بريدك الإلكتروني">
		  </div>

		  <div class="input-group1">
			<label for="faculty">الكلية</label>
			<select name="facultys" id="faculty">
			  <option value="حاسوب">حاسوب</option>
			  <option value="طب">طب</option>
			  <option value="صيدلة">صيدلة</option>
			  <option value="تمريض">تمريض</option>
			</select>
		  </div>
		  
		  <div class="input-group1">
			<label for="patch">الدفعة</label>
			<select name="patchs" id="faculty">
			  <option value="39">39</option>
			  <option value="40">40</option>
			  <option value="41">41</option>
			  <option value="42">42</option>
			  <option value="43">43</option>
			  <option value="44">44</option>
			  <option value="45">45</option>
			  <option value="46">46</option>
			</select>
		  </div>

		  <div class="input-group">
			<label for="password">كلمة المرور</label>
			<input type="password" id="password1" required placeholder="ادخل كلمة المرور">
		  </div>


		  <div class="input-group">
			<label for="password">تأكيد كلمة المرور</label>
			<input type="password" id="password2" required placeholder="تأكيد كلمة المرور">
		  </div>

		  
		  

		  <button type="submit" class="submit-btn">تسجيل الحساب</button>
		</form>

		<div class="form-footer">
		  لديك حساب بالفعل؟ <a href="login.html">سجل دخولك من هنا</a>
		</div>
	  </div>
    </main>

<script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); // منع إعادة تحميل الصفحة مؤقتاً
            
            // محاكاة إنشاء الحساب بنجاح والانتقال للرئيسية
            alert('تم إنشاء الحساب بنجاح!');
            window.location.href = "index.html";
        });
</script>

  </body>
</html>
