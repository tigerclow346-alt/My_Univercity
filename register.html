<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - منصتي</title>
<link rel="stylesheet" href="styles.css">

  
  
  
  </head>
  <body>
 
    <header>
      <h2>صفحة تسجيل عضو جديد</h2>
      <div>
        <a href="index.html">الرئيسية</a>
      </div>
    </header>

    <main>
      <div class="form-card">
        <h2>إنشاء حساب جديد</h2>
        <form id="registerForm">
          <div class="input-group">
            <label for="appname">الاسم (الذي سيظهر في التطبيق)</label>
            <input type="text" id="appname" required placeholder="ادخل الاسم الذي سيظهر للآخرين">
          </div>
           
          <div class="input-group">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" required placeholder="ادخل بريدك الإلكتروني">
          </div>

          <div class="input-group">
            <label for="password1">كلمة المرور</label>
            <input type="password" id="password1" required placeholder="ادخل كلمة المرور">
          </div>

          <div class="input-group">
            <label for="password2">تأكيد كلمة المرور</label>
            <input type="password" id="password2" required placeholder="أعد إدخال كلمة المرور">
          </div>

          <button type="submit" class="submit-btn">تسجيل الحساب</button>
        </form>

        <div class="form-footer">
          لديك حساب بالفعل؟ <a href="login.html">سجل دخولك من هنا</a>
        </div>
      </div>
    </main>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم إنشاء الحساب بنجاح!');
            window.location.href = "index.html";
        });
    </script>

  </body>
</html>
