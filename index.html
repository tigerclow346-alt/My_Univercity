<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الصور المطور - الاعدادية</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>

    <header>
      <div class="header-right">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <h2 class="app-title">الاعدادية</h2>
      </div>
    </header>

    <nav class="sub-nav">
      <a href="index.html" class="nav-link">الرئيسية</a>
      <a href="uni_activitys.html" class="nav-link">نشاطات الجامعة</a>
      <a href="uni_adverts.html" class="nav-link">إعلانات امتحانات</a>
    </nav>

    <div id="mySidebar" class="sidebar">
      <button class="close-btn" onclick="toggleSidebar()">&times;</button>
      <a href="login.html">تسجيل دخول</a>
      <a href="contact.html">تواصل معنا</a>
      <a href="publishing.html">نشر صورة</a>
    </div>

    <div id="overlay" onclick="toggleSidebar()"></div>

    <main>
	  <div class="slider-section">
		<h3>الصور الاكثر اعجاباً</h3>
		<div class="slider-container">
		  <div id="sliderTrack" class="slider-track"></div>
		</div>
	  </div>

	  <div class="grid-section">
		<h3>معرض الصور</h3>
        <p style="font-size: 13px; color: #666; text-align: center;">(لوحة تحكم المشرف: يمكنك حذف أي صورة)</p>
		<div id="postsGrid" class="custom-grid"></div>
	  </div>
    </main>

    <script src="script.js"></script>
    <script>
        // جاهز للربط المستقبلي مع Database API
        function loadIndexPosts() {
            let sliderPosts = JSON.parse(localStorage.getItem('posts_index_slider')) || [];
            let gridPosts = JSON.parse(localStorage.getItem('posts_index_grid')) || [];
            
            const postsGrid = document.getElementById('postsGrid');
            const sliderTrack = document.getElementById('sliderTrack');
            
            if(postsGrid) postsGrid.innerHTML = '';
            if(sliderTrack) sliderTrack.innerHTML = '';

            if (sliderPosts.length === 0) {
                if(sliderTrack) sliderTrack.innerHTML = '<p class="empty-msg" style="width:100%;">لا توجد صور في الشريط المتحرك.</p>';
            } else {
                sliderPosts.forEach((imgSrc, index) => {
                    const sliderItem = document.createElement('div');
                    sliderItem.className = 'slider-item';
                    sliderItem.innerHTML = `<img src="${imgSrc}" alt="صورة متحركة">`;
                    sliderTrack.appendChild(sliderItem);
                });
            }

            if (gridPosts.length === 0) {
                if(postsGrid) postsGrid.innerHTML = '<p class="empty-msg">لا توجد صور منشورة في المعرض حالياً.</p>';
            } else {
                gridPosts.forEach((imgSrc, index) => {
                    const gridBox = document.createElement('div');
                    gridBox.className = 'grid-box';
                    
                    const img = document.createElement('img');
                    img.src = imgSrc;
                    img.alt = "صورة المعرض";

                    // زر الحذف (مهيأ للتحقق من صلاحيات المشرفين عند ربط القاعدة)
                    const deleteBtn = document.createElement('button');
                    deleteBtn.innerHTML = '🗑️ حذف الصورة';
                    deleteBtn.style.cssText = 'background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; margin-top: 8px; width: 100%; font-weight: bold; font-family: Tahoma, sans-serif;';
                    
                    deleteBtn.onclick = function() {
                        if (confirm('هل أنت متأكد من حذف هذه الصورة من الرئيسية؟')) {
                            gridPosts.splice(index, 1);
                            localStorage.setItem('posts_index_grid', JSON.stringify(gridPosts));
                            loadIndexPosts();
                            alert('تم الحذف بنجاح!');
                        }
                    };

                    gridBox.appendChild(img);
                    gridBox.appendChild(deleteBtn);
                    postsGrid.appendChild(gridBox);
                });
            }
        }
        loadIndexPosts();

        const track = document.getElementById('sliderTrack');
        if (track) {
            setInterval(() => {
                if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 10) {
                    track.scrollTo({ left: 0, behavior: 'smooth' });
                } else {
                    track.scrollBy({ left: track.clientWidth, behavior: 'smooth' });
                }
            }, 3000);
        }
    </script>
  </body>
</html>
