<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الصور المطور - الاعدادية</title>
<link rel="stylesheet" href="styles.css">
  </head>
 
  
  <body>

    <!-- الهيدر الثابت -->
    <header>
      <div class="header-right">
        <!-- زر القائمة الجانبية (الثلاث خطوط) -->
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <h2 class="app-title">الاعدادية</h2>
      </div>
    </header>

    <!-- شريط التنقل السفلي المستقل وحده -->
    <nav class="sub-nav">
      <a href="index.html" class="nav-link">الرئيسية</a>
     
      <a href="uni_activitys.html" class="nav-link">نشاطات الجامعة</a>
      <a href="uni_adverts.html" class="nav-link">إعلانات امتحانات</a>
    </nav>

    <!-- القائمة الجانبية (Sidebar) -->
    <div id="mySidebar" class="sidebar">
      <button class="close-btn" onclick="toggleSidebar()">&times;</button>
      
      <a href="login.html">تسجيل دخول</a>
      <a href="contact.html">تواصل معنا</a>
	    <a href="settings.html">الإعدادات</a>
    </div>

    <!-- طبقة شفافة تغطي الشاشة عند فتح القائمة -->
    <div id="overlay" onclick="toggleSidebar()"></div>

    <main>


	  <!-- 1. قسم اللاياوت المتحرك (يمين ويسار) -->
	  <div class="slider-section">
		<h3>الصور الاكثر اعجاباً</h3>
		<div class="slider-container">
		  <button class="slider-btn prev-btn" onclick="slide(-1)">&#10095;</button>
		  <div id="sliderTrack" class="slider-track">
			<!-- ستظهر الصور هنا متحركة -->
		  </div>
		  <button class="slider-btn next-btn" onclick="slide(1)">&#10094;</button>
		</div>
	  </div>

	  <!-- 2. قسم الصور في الشاشة (صورتين في كل صف بأبعاد محددة) -->
	  <div class="grid-section">
		<h3>معرض الصور (صورتين في السطر)</h3>
		<div id="postsGrid" class="custom-grid">
		  <!-- ستظهر الصور هنا بنظام صورتين لكل صف -->
		</div>
	  </div>
    </main>


<script src="script.js"></script>
  </body>
</html>
